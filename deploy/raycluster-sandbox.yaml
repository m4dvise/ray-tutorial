apiVersion: v1
kind: Namespace
metadata:
  name: ray-tutorial
---
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: ray-tutorial-sandbox
  namespace: ray-tutorial
spec:
  rayVersion: '2.58.0'
  headGroupSpec:
    rayStartParams:
      num-cpus: '0'
    template:
      spec:
        containers:
          - name: head
            image: rayproject/ray:2.58.0-py311-cpu
  workerGroupSpecs:
    - groupName: workers
      replicas: 2
      template:
        spec:
          containers:
            - name: worker
              image: rayproject/ray:2.58.0-py311-cpu
